<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #link {
            color: rgb(0,113,133);
        }
        #pris {
            color: rgb(0,118,0);
            font-weight: bold;
        }

        .btn{
            width: 100px;
            height: 30px;
            border-radius: 25px;
            border: 0;
            margin-right: 10px;
            cursor: pointer;
        }
        .add {
            background-color: rgb(255,216,20);
        }
        .buy {
            background-color: rgb(255,164,28);
        }
        #header{
            font-size:x-large;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <a id="link" href="https://www.amazon.com" target="_blank">Back to Amazon</a>
    <p id="header">Nike Black Running Shoes</p>
    <p id="pris">$39 - in stock.</p>
    <p>Free delivery tomorrow.</p>
    <button class="btn add" >Add to Cart</button>
    <button class="btn buy">Buy now</button>
</body>
</html>
